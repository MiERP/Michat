name: CI

on:
  push:
    branches: [main, 'Michat-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency floors
        run: pnpm check:deps

      - name: Version consistency
        run: pnpm check:version

      - name: Production audit
        run: pnpm security:audit

      - name: Encoding check
        run: pnpm check:encoding

      - name: CJK check
        run: pnpm check:cjk

      - name: Migration snapshots
        run: pnpm check:migrations

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Fresh clones have no runtime binaries/models (they are gitignored), so
      # CI validates the model-less packaging path and the asar contents.
      - name: Package smoke (Windows)
        if: runner.os == 'Windows'
        run: pnpm package:ci

      - name: E2E smoke (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:e2e
