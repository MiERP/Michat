<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ Đồ Kết Nối Luồng Dữ Liệu MiChat (Data Flow Diagram)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .flow-node {
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .flow-node:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen p-4 md:p-8">

  <!-- Header & Export Action Bar -->
  <div class="max-w-[1340px] mx-auto mb-6 bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
    <div>
      <div class="flex items-center gap-3">
        <span class="px-3 py-1 bg-sky-100 text-sky-700 font-bold text-xs rounded-full uppercase tracking-wider flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Data Flow Diagram
        </span>
        <span class="px-3 py-1 bg-amber-100 text-amber-700 font-semibold text-xs rounded-full">4 Luồng Xử Lý Cốt Lõi</span>
        <span class="px-3 py-1 bg-emerald-100 text-emerald-700 font-semibold text-xs rounded-full">End-to-End Pipeline</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mt-2">Sơ Đồ Kết Nối Luồng Dữ Liệu Giữa Các Phân Hệ MiChat</h1>
      <p class="text-sm text-slate-500 mt-1">Truy vết dòng chảy dữ liệu từ nạp tài liệu, bóc tách vector, hỏi đáp RAG có trích dẫn đến sinh MindMap và Quiz</p>
    </div>

    <!-- Export Buttons -->
    <div class="flex items-center gap-2.5 flex-wrap">
      <button onclick="downloadPNG()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl shadow-sm transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Tải ảnh PNG (2K)
      </button>
      <button onclick="downloadSVG()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-xl shadow-sm transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/></svg>
        Tải file SVG
      </button>
      <button onclick="window.print()" class="inline-flex items-center gap-2 px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-xl transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        In / PDF
      </button>
    </div>
  </div>

  <!-- Canvas Container -->
  <div class="max-w-[1340px] mx-auto bg-white rounded-2xl p-4 md:p-8 shadow-md border border-slate-200 overflow-x-auto">
    <div id="diagram-wrapper" class="min-w-[1260px] flex justify-center bg-white p-2">
      <!-- Standalone SVG Data Flow Diagram -->
      <svg id="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" width="1280" height="1020" class="w-full h-auto select-none bg-white">
        <defs>
          <style>
            text {
              font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            }
          </style>

          <!-- Gradients -->
          <linearGradient id="hdr-ui" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284c7" /><stop offset="100%" stop-color="#0369a1" />
          </linearGradient>
          <linearGradient id="hdr-bridge" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#d97706" />
          </linearGradient>
          <linearGradient id="hdr-main" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#059669" /><stop offset="100%" stop-color="#047857" />
          </linearGradient>
          <linearGradient id="hdr-ingest" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e11d48" /><stop offset="100%" stop-color="#be123c" />
          </linearGradient>
          <linearGradient id="hdr-ai" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7c3aed" /><stop offset="100%" stop-color="#6d28d9" />
          </linearGradient>
          <linearGradient id="hdr-training" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0d9488" /><stop offset="100%" stop-color="#0f766e" />
          </linearGradient>
          <linearGradient id="hdr-storage" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#475569" /><stop offset="100%" stop-color="#334155" />
          </linearGradient>

          <!-- Filter Shadow -->
          <filter id="shadow-card" x="-4%" y="-4%" width="108%" height="110%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
          </filter>

          <!-- Arrow Markers by Flow Type -->
          <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 8 5 L 0 8 z" fill="#e11d48" />
          </marker>
          <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 8 5 L 0 8 z" fill="#0284c7" />
          </marker>
          <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 8 5 L 0 8 z" fill="#7c3aed" />
          </marker>
          <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 8 5 L 0 8 z" fill="#059669" />
          </marker>
          <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 8 5 L 0 8 z" fill="#64748b" />
          </marker>

          <!-- Grid Background Pattern -->
          <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#f1f5f9" />
          </pattern>
        </defs>

        <!-- Base Background -->
        <rect width="1280" height="1020" fill="#ffffff" />
        <rect width="1280" height="1020" fill="url(#dot-grid)" />

        <!-- Title Block -->
        <g id="title-block">
          <text x="640" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">SƠ ĐỒ KẾT NỐI LUỒNG DỮ LIỆU ĐA PHÂN HỆ (END-TO-END DATA FLOW)</text>
          <text x="640" y="60" text-anchor="middle" font-size="12.5" font-weight="500" fill="#64748b">Quy trình điều phối thông điệp IPC, bóc tách RAG, truy vấn véc-tơ, suy luận AI và xuất bản bài giảng</text>
          <line x1="80" y1="74" x2="1200" y2="74" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 4" />
        </g>

        <!-- ==================== FLOW PATHWAYS (BACKGROUND CONNECTORS) ==================== -->
        <g id="flow-lines" stroke-width="2" fill="none">
          <!-- LUỒNG 1 (ĐỎ): NẠP TÀI LIỆU -->
          <!-- UI Upload (180, 210) -> Bridge (280, 248) -->
          <path d="M 180 210 L 180 248" stroke="#e11d48" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
          <!-- Bridge (220, 316) -> Main Process (220, 350) -->
          <path d="M 220 316 L 220 350" stroke="#e11d48" marker-end="url(#arrow-red)"/>
          <!-- Main Process (200, 450) -> Ingestion (200, 485) -->
          <path d="M 200 450 L 200 485" stroke="#e11d48" marker-end="url(#arrow-red)"/>
          <!-- Ingestion Chunks (385, 680) -> Embeddings in AI Engine (470, 680) -->
          <path d="M 385 680 L 470 680" stroke="#e11d48" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
          <!-- Embeddings back to Ingestion -> DB Storage (200, 770) -> (200, 810) -->
          <path d="M 200 770 L 200 810" stroke="#e11d48" marker-end="url(#arrow-red)"/>

          <!-- LUỒNG 2 (XANH DƯƠNG): HỎI ĐÁP RAG & TRÍCH DẪN -->
          <!-- UI Chat (480, 210) -> Bridge (480, 248) -->
          <path d="M 480 210 L 480 248" stroke="#0284c7" marker-end="url(#arrow-blue)"/>
          <!-- Bridge (480, 316) -> Main Process (480, 350) -->
          <path d="M 480 316 L 480 350" stroke="#0284c7" marker-end="url(#arrow-blue)"/>
          <!-- Main Process (640, 450) -> AI Engine (640, 485) -->
          <path d="M 640 450 L 640 485" stroke="#0284c7" marker-end="url(#arrow-blue)"/>
          <!-- AI Engine (470, 560) -> Vector Search in DB (385, 870) -->
          <path d="M 470 560 Q 400 560 400 830 L 470 870" stroke="#0284c7" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>
          <!-- Context injection back from DB to AI Engine (640, 830) -> (640, 770) -->
          <path d="M 640 830 L 640 770" stroke="#0284c7" marker-end="url(#arrow-blue)"/>
          <!-- Stream response back to UI: Main Process (680, 350) -> Bridge (680, 316) -> UI (680, 210) -->
          <path d="M 680 350 L 680 316" stroke="#0284c7" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
          <path d="M 680 248 L 680 210" stroke="#0284c7" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>

          <!-- LUỒNG 3 (TÍM): SINH SƠ ĐỒ TƯ DUY (MINDMAP) -->
          <!-- UI MindMap (800, 210) -> Bridge -> Main Process -> Training Subsystems (950, 485) -->
          <path d="M 780 210 L 780 248" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
          <path d="M 780 316 L 780 350" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
          <path d="M 820 450 Q 820 470 940 485" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
          <!-- AI prompt exchange between AI Engine & Training (810, 570) <-> (890, 570) -->
          <path d="M 810 570 L 890 570" stroke="#7c3aed" stroke-dasharray="3 3" marker-end="url(#arrow-purple)"/>
          <path d="M 890 590 L 810 590" stroke="#7c3aed" stroke-dasharray="3 3" marker-end="url(#arrow-purple)"/>

          <!-- LUỒNG 4 (XANH LÁ): SINH ĐỀ & CHẤM THI TRẮC NGHIỆM (QUIZ) -->
          <!-- UI Quiz (1080, 210) -> Bridge -> Main -> Training Subsystem (1090, 485) -->
          <path d="M 1080 210 L 1080 248" stroke="#059669" marker-end="url(#arrow-emerald)"/>
          <path d="M 1080 316 L 1080 350" stroke="#059669" marker-end="url(#arrow-emerald)"/>
          <path d="M 1080 450 L 1080 485" stroke="#059669" marker-end="url(#arrow-emerald)"/>
          <!-- Quiz grading feedback to Storage (1040, 770) -> DB (880, 850) -->
          <path d="M 1040 770 Q 1040 860 880 880" stroke="#059669" stroke-dasharray="4 3" marker-end="url(#arrow-emerald)"/>
        </g>

        <!-- ==================== 1. TẦNG GIAO DIỆN NGƯỜI DÙNG (RENDERER UI) ==================== -->
        <g id="layer-ui" class="flow-node" filter="url(#shadow-card)" transform="translate(60, 95)">
          <rect width="1160" height="115" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
          <path d="M 0 12 A 12 12 0 0 1 12 0 L 1148 0 A 12 12 0 0 1 1160 12 L 1160 32 L 0 32 Z" fill="url(#hdr-ui)"/>
          <text x="16" y="21" font-size="13" font-weight="800" fill="#ffffff">PHÂN HỆ GIAO DIỆN NGƯỜI DÙNG (RENDERER UI PROCESS - REACT 19 + TAILWIND V4)</text>
          <text x="1144" y="21" text-anchor="end" font-size="11" font-weight="600" fill="#e0f2fe">VÙNG KHÔNG GIAN BẢO VỆ (SANDBOX)</text>

          <!-- UI Components (4 Sub-modules) -->
          <g transform="translate(15, 45)">
            <!-- Box 1: Document Upload & Management -->
            <rect width="265" height="56" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
            <text x="12" y="22" font-size="11.5" font-weight="700" fill="#be123c">📂 Nạp & Quản Lý Giáo Trình</text>
            <text x="12" y="40" font-size="10" font-weight="500" fill="#475569">Chọn PDF, Word, Excel, Slide PPTX</text>
            <circle cx="245" cy="22" r="9" fill="#e11d48"/>
            <text x="245" y="26" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">①</text>
          </g>

          <g transform="translate(300, 45)">
            <!-- Box 2: Chat & Streamed Citations -->
            <rect width="275" height="56" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
            <text x="12" y="22" font-size="11.5" font-weight="700" fill="#0369a1">💬 Giao Diện Hỏi Đáp & Trích Dẫn</text>
            <text x="12" y="40" font-size="10" font-weight="500" fill="#475569">Nhận token stream, bấm xem trang gốc</text>
            <circle cx="255" cy="22" r="9" fill="#0284c7"/>
            <text x="255" y="26" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">②</text>
          </g>

          <g transform="translate(595, 45)">
            <!-- Box 3: MindMap Interactive Viewer -->
            <rect width="270" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
            <text x="12" y="22" font-size="11.5" font-weight="700" fill="#6d28d9">🧠 Khám Phá Sơ Đồ Tư Duy</text>
            <text x="12" y="40" font-size="10" font-weight="500" fill="#475569">React Flow: Zoom, Pan, Click mở node</text>
            <circle cx="250" cy="22" r="9" fill="#7c3aed"/>
            <text x="250" y="26" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">③</text>
          </g>

          <g transform="translate(885, 45)">
            <!-- Box 4: Quiz Workspace & Test Runner -->
            <rect width="260" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
            <text x="12" y="22" font-size="11.5" font-weight="700" fill="#047857">📝 Không Gian Làm Bài Trắc Nghiệm</text>
            <text x="12" y="40" font-size="10" font-weight="500" fill="#475569">Chọn đáp án, tính điểm, xem giải thích</text>
            <circle cx="240" cy="22" r="9" fill="#059669"/>
            <text x="240" y="26" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">④</text>
          </g>
        </g>

        <!-- ==================== 2. CẦU NỐI AN TOÀN (PRELOAD CONTEXTBRIDGE IPC) ==================== -->
        <g id="layer-bridge" class="flow-node" filter="url(#shadow-card)" transform="translate(160, 248)">
          <rect width="960" height="68" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" />
          <path d="M 0 10 A 10 10 0 0 1 10 0 L 950 0 A 10 10 0 0 1 960 10 L 960 22 L 0 22 Z" fill="url(#hdr-bridge)"/>
          <text x="16" y="16" font-size="11.5" font-weight="800" fill="#ffffff">CẦU NỐI ĐIỀU PHỐI THÔNG ĐIỆP AN TOÀN (PRELOAD CONTEXTBRIDGE IPC GATEWAY)</text>
          
          <g transform="translate(20, 36)">
            <text x="0" y="14" font-size="11" font-weight="700" fill="#92400e">Kênh luồng dữ liệu hai chiều (Typed IPC Channels):</text>
            <text x="310" y="14" font-size="10.5" font-weight="500" fill="#78350f">
              • upload:document ⇄ • chat:stream-query ⇄ • mindmap:generate ⇄ • quiz:evaluate-session
            </text>
          </g>
          
          <rect x="830" y="32" width="115" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
          <text x="887.5" y="48" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Validation Guard</text>
        </g>

        <!-- ==================== 3. BỘ ĐIỀU PHỐI TRUNG TÂM (ELECTRON MAIN CONTROLLER) ==================== -->
        <g id="layer-main" class="flow-node" filter="url(#shadow-card)" transform="translate(60, 350)">
          <rect width="1160" height="98" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
          <path d="M 0 12 A 12 12 0 0 1 12 0 L 1148 0 A 12 12 0 0 1 1160 12 L 1160 32 L 0 32 Z" fill="url(#hdr-main)"/>
          <text x="16" y="21" font-size="13" font-weight="800" fill="#ffffff">BỘ XỬ LÝ TRUNG TÂM & ĐIỀU PHỐI TÁC VỤ (ELECTRON MAIN PROCESS COORDINATOR)</text>
          <text x="1144" y="21" text-anchor="end" font-size="11" font-weight="600" fill="#d1fae5">NATIVE ENVIRONMENT</text>

          <g transform="translate(15, 45)">
            <!-- Main Controller 1 -->
            <rect width="265" height="42" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
            <text x="10" y="17" font-size="11" font-weight="700" fill="#047857">🗂️ Ingestion Dispatcher</text>
            <text x="10" y="32" font-size="9.5" font-weight="500" fill="#475569">Nhận file, kích hoạt Parser & Splitter</text>
          </g>

          <g transform="translate(300, 45)">
            <!-- Main Controller 2 -->
            <rect width="275" height="42" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
            <text x="10" y="17" font-size="11" font-weight="700" fill="#047857">🔍 RAG Query Orchestrator</text>
            <text x="10" y="32" font-size="9.5" font-weight="500" fill="#475569">Nhúng truy vấn, tìm kiếm vector tương đồng</text>
          </g>

          <g transform="translate(595, 45)">
            <!-- Main Controller 3 -->
            <rect width="270" height="42" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
            <text x="10" y="17" font-size="11" font-weight="700" fill="#047857">🤖 LLM Session Manager</text>
            <text x="10" y="32" font-size="9.5" font-weight="500" fill="#475569">Quản lý ngữ cảnh, stream tokens về UI</text>
          </g>

          <g transform="translate(885, 45)">
            <!-- Main Controller 4 -->
            <rect width="260" height="42" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
            <text x="10" y="17" font-size="11" font-weight="700" fill="#047857">🎖️ Learning Pipeline Manager</text>
            <text x="10" y="32" font-size="9.5" font-weight="500" fill="#475569">Khởi chạy sinh MindMap và Quiz tự động</text>
          </g>
        </g>

        <!-- ==================== 4. THREE EXECUTION ENGINES ==================== -->

        <!-- COLUMN 1: DOCUMENT INGESTION & PARSING PIPELINE -->
        <g id="col-ingest" class="flow-node" filter="url(#shadow-card)" transform="translate(60, 485)">
          <rect width="345" height="285" rx="12" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5" />
          <path d="M 0 12 A 12 12 0 0 1 12 0 L 333 0 A 12 12 0 0 1 345 12 L 345 32 L 0 32 Z" fill="url(#hdr-ingest)"/>
          <text x="14" y="21" font-size="12.5" font-weight="800" fill="#ffffff">KHỐI NẠP & BÓC TÁCH TÀI LIỆU</text>
          <text x="330" y="21" text-anchor="end" font-size="10.5" font-weight="600" fill="#ffe4e6">PIPELINE ①</text>

          <!-- Sub-step 1: File Loaders -->
          <g transform="translate(14, 45)">
            <rect width="317" height="64" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
            <text x="10" y="18" font-size="11" font-weight="700" fill="#9f1239">📄 1. File Loaders Đa Định Dạng</text>
            <text x="10" y="34" font-size="9.5" font-weight="500" fill="#475569">• Bóc tách PDF (văn bản, số trang, hình ảnh)</text>
            <text x="10" y="49" font-size="9.5" font-weight="500" fill="#475569">• Bóc tách Word (.docx), Excel (.xlsx), Slide PPTX</text>
          </g>

          <line x1="172" y1="115" x2="172" y2="128" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arrow-red)"/>

          <!-- Sub-step 2: Semantic Chunking -->
          <g transform="translate(14, 130)">
            <rect width="317" height="66" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
            <text x="10" y="18" font-size="11" font-weight="700" fill="#9f1239">✂️ 2. Thuật Toán Phân Đoạn (Chunking)</text>
            <text x="10" y="34" font-size="9.5" font-weight="500" fill="#475569">• Chia đoạn theo ranh giới câu, token overlap</text>
            <text x="10" y="49" font-size="9.5" font-weight="500" fill="#475569">• Gắn nhãn số trang, tiêu đề chương mục (Metadata)</text>
          </g>

          <line x1="172" y1="202" x2="172" y2="215" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arrow-red)"/>

          <!-- Sub-step 3: Vector Dispatch -->
          <g transform="translate(14, 218)">
            <rect width="317" height="54" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>

  <!-- Download Scripts -->
  <script>
    // Export PNG 2K
    function downloadPNG() {
      const svg = document.getElementById('diagram-svg');
      const svgData = new XMLSerializer().serializeToString(svg);
      
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      
      const scale = 2;
      const width = 1280;
      const height = 1020;
      
      canvas.width = width * scale;
      canvas.height = height * scale;
      
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);
      
      img.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const pngUrl = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngUrl;
        downloadLink.download = 'so_do_ket_noi_luong_du_lieu_michat.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobURL);
      };
      
      img.src = blobURL;
    }

    // Export SVG Vector
    function downloadSVG() {
      const svg = document.getElementById('diagram-svg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const svgUrl = URL.createObjectURL(svgBlob);
      
      const downloadLink = document.createElement('a');
      downloadLink.href = svgUrl;
      downloadLink.download = 'so_do_ket_noi_luong_du_lieu_michat.svg';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(svgUrl);
    }
  </script>
