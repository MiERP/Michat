<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ Đồ Kiến Trúc Phân Tầng Bảo Mật MiChat (3-Tier Security)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .diagram-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .diagram-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen p-4 md:p-8">

  <!-- Header & Export Action Bar -->
  <div class="max-w-[1300px] mx-auto mb-6 bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
    <div>
      <div class="flex items-center gap-3">
        <span class="px-3 py-1 bg-red-100 text-red-700 font-bold text-xs rounded-full uppercase tracking-wider flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          Phân Tầng Bảo Mật
        </span>
        <span class="px-3 py-1 bg-indigo-100 text-indigo-700 font-semibold text-xs rounded-full">Chuẩn Dữ Liệu Quân Sự / Local-First</span>
        <span class="px-3 py-1 bg-emerald-100 text-emerald-700 font-semibold text-xs rounded-full">3-Tier Electron Architecture</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mt-2">Kiến Trúc Phân Tầng Bảo Mật 3 Lớp (3-Tier Security Architecture)</h1>
      <p class="text-sm text-slate-500 mt-1">Cách ly không gian thực thi, kiểm soát kênh truyền và bảo vệ dữ liệu quân sự độc lập</p>
    </div>

    <!-- Export Buttons -->
    <div class="flex items-center gap-2.5 flex-wrap">
      <button onclick="downloadPNG()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl shadow-sm transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Tải ảnh PNG (2K)
      </button>
      <button onclick="downloadSVG()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-xl shadow-sm transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/></svg>
        Tải file SVG
      </button>
      <button onclick="window.print()" class="inline-flex items-center gap-2 px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-xl transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        In / PDF
      </button>
    </div>
  </div>

  <!-- Canvas Container -->
  <div class="max-w-[1300px] mx-auto bg-white rounded-2xl p-4 md:p-8 shadow-md border border-slate-200 overflow-x-auto">
    <div id="diagram-wrapper" class="min-w-[1140px] flex justify-center bg-white p-2">
      <!-- Standalone SVG -->
      <svg id="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" class="w-full h-auto select-none bg-white">
        <defs>
          <style>
            text {
              font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            }
          </style>

          <!-- Gradients -->
          <linearGradient id="grad-tier1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#0369a1" />
          </linearGradient>

          <linearGradient id="grad-tier2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#b45309" />
          </linearGradient>

          <linearGradient id="grad-tier3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f766e" />
            <stop offset="100%" stop-color="#115e59" />
          </linearGradient>

          <linearGradient id="grad-shield" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ef4444" stop-opacity="0.1" />
            <stop offset="50%" stop-color="#ef4444" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1" />
          </linearGradient>

          <!-- Shadow Filter -->
          <filter id="shadow-card" x="-4%" y="-4%" width="108%" height="110%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
          </filter>

          <!-- Markers -->
          <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
          </marker>
          <marker id="arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
          </marker>
          <marker id="arrow-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e" />
          </marker>

          <!-- Grid Background Pattern -->
          <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#f1f5f9" />
          </pattern>
        </defs>

        <!-- Base Background -->
        <rect width="1200" height="960" fill="#ffffff" />
        <rect width="1200" height="960" fill="url(#dot-grid)" />

        <!-- ==================== HEADER SECTION ==================== -->
        <g id="header-group">
          <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5">SƠ ĐỒ KIẾN TRÚC PHÂN TẦNG BẢO MẬT (3-TIER SECURITY)</text>
          <text x="600" y="64" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">Mô hình cách ly độc lập, kiểm soát đặc quyền tối thiểu & bảo vệ cấu trúc dữ liệu quân sự</text>
          <line x1="80" y1="78" x2="1120" y2="78" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />
        </g>

        <!-- ==================== TẦNG 1: TẦNG GIAO DIỆN (RENDERER LAYER) ==================== -->
        <g id="tier-1" class="diagram-card" filter="url(#shadow-card)">
          <rect x="60" y="95" width="1080" height="190" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="1.8" />
          <path d="M 60 109 A 14 14 0 0 1 74 95 L 1126 95 A 14 14 0 0 1 1140 109 L 1140 134 L 60 134 Z" fill="url(#grad-tier1)" />
          
          <!-- Title & Status -->
          <text x="80" y="122" font-size="14" font-weight="800" fill="#ffffff">TẦNG 1: TẦNG GIAO DIỆN (RENDERER LAYER)</text>
          <text x="440" y="122" font-size="12" font-weight="600" fill="#e0f2fe">|   KHÔNG GIAN CÁCH LY • ZERO-PRIVILEGE ZONE</text>
          
          <!-- Badges Right -->
          <rect x="850" y="103" width="130" height="22" rx="4" fill="#026aa2" />
          <text x="915" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">nodeIntegration: false</text>
          <rect x="990" y="103" width="135" height="22" rx="4" fill="#026aa2" />
          <text x="1057.5" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">sandbox: true (V8)</text>

          <!-- Description row -->
          <text x="80" y="156" font-size="11.5" font-weight="600" fill="#0369a1">
            🛡️ Cơ chế bảo vệ: Không sở hữu quyền thực thi mã hệ điều hành, bị vô hiệu hóa hoàn toàn Node.js API, ngăn chặn tấn công chiếm quyền (RCE/XSS).
          </text>

          <!-- 3 Columns inside Tier 1 -->
          <!-- Col 1.1: Presentation Components -->
          <g transform="translate(80, 172)">
            <rect width="315" height="94" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
            <text x="14" y="24" font-size="12" font-weight="800" fill="#0369a1">💻 React 19 & Tailwind CSS v4</text>
            <text x="14" y="44" font-size="10.5" font-weight="500" fill="#475569">• Giao diện hội thoại tương tác người dùng</text>
            <text x="14" y="62" font-size="10.5" font-weight="500" fill="#475569">• Trình kết xuất cây MindMap & thi Quiz</text>
            <text x="14" y="80" font-size="10.5" font-weight="600" fill="#0284c7">➜ Bị cô lập hoàn toàn khỏi tệp tin cục bộ</text>
          </g>

          <!-- Col 1.2: State Management -->
          <g transform="translate(422, 172)">
            <rect width="315" height="94" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
            <text x="14" y="24" font-size="12" font-weight="800" fill="#0369a1">🗂️ Quản lý trạng thái (Zustand Stores)</text>
            <text x="14" y="44" font-size="10.5" font-weight="500" fill="#475569">• 12 Stores quản lý dữ liệu UI tạm thời</text>
            <text x="14" y="62" font-size="10.5" font-weight="500" fill="#475569">• Dữ liệu chỉ nằm trong bộ nhớ RAM tạm thời</text>
            <text x="14" y="80" font-size="10.5" font-weight="600" fill="#0284c7">➜ Tự động giải phóng khi đóng phiên làm việc</text>
          </g>

          <!-- Col 1.3: Client API Caller -->
          <g transform="translate(765, 172)">
            <rect width="315" height="94" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
            <text x="14" y="24" font-size="12" font-weight="800" fill="#0369a1">🔗 Client API Consumer (window.api)</text>
            <text x="14" y="44" font-size="10.5" font-weight="500" fill="#475569">• Chỉ tương tác qua hàm trung gian được expose</text>
            <text x="14" y="62" font-size="10.5" font-weight="500" fill="#475569">• Không thể tự ý mở Socket, Port hay Disk IO</text>
            <text x="14" y="80" font-size="10.5" font-weight="600" fill="#0284c7">➜ Chặn đứng Prototype Pollution</text>
          </g>
        </g>

        <!-- ==================== SECURITY BARRIER 1: CONTEXT ISOLATION ==================== -->
        <g id="security-barrier-1" transform="translate(60, 298)">
          <rect width="1080" height="32" rx="6" fill="url(#grad-shield)" stroke="#f87171" stroke-width="1.2" stroke-dasharray="6 4"/>
          <!-- Shield Icon and text -->
          <text x="540" y="21" text-anchor="middle" font-size="11.5" font-weight="800" fill="#b91c1c" letter-spacing="0.5">
            ⚔️ RANH GIỚI BẢO MẬT 1: BỨC TƯỜNG CÁCH LY NGỮ CẢNH (CONTEXT ISOLATION = TRUE) ⚔️
          </text>
          <!-- Downward flow arrows -->
          <line x1="240" y1="32" x2="240" y2="44" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />
          <line x1="540" y1="32" x2="540" y2="44" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />
          <line x1="840" y1="32" x2="840" y2="44" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />
        </g>

        <!-- ==================== TẦNG 2: TẦNG CẦU NỐI BẢO MẬT (PRELOAD IPC BRIDGE) ==================== -->
        <g id="tier-2" class="diagram-card" filter="url(#shadow-card)">
          <rect x="60" y="345" width="1080" height="205" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.8" />
          <path d="M 60 359 A 14 14 0 0 1 74 345 L 1126 345 A 14 14 0 0 1 1140 359 L 1140 384 L 60 384 Z" fill="url(#grad-tier2)" />

          <!-- Title & Badges -->
          <text x="80" y="372" font-size="14" font-weight="800" fill="#ffffff">TẦNG 2: TẦNG CẦU NỐI BẢO MẬT (PRELOAD IPC BRIDGE)</text>
          <text x="495" y="372" font-size="12" font-weight="600" fill="#fef3c7">|   VÙNG ĐỆM AN TOÀN • DMZ GATEWAY & SANITIZATION</text>

          <rect x="910" y="353" width="215" height="22" rx="4" fill="#92400e" />
          <text x="1017.5" y="368" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">contextBridge.exposeInMainWorld</text>

          <text x="80" y="406" font-size="11.5" font-weight="600" fill="#92400e">
            🛡️ Cơ chế bảo vệ: Đóng vai trò Cổng gác an ninh (Security Gateway), lọc dữ liệu, thẩm định cấu trúc trước khi chuyển giao vào tầng Main.
          </text>

          <!-- 3 Columns inside Tier 2 -->
          <!-- Col 2.1: Context Bridge -->
          <g transform="translate(80, 422)">
            <rect width="315" height="110" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
            <text x="14" y="24" font-size="12" font-weight="800" fill="#92400e">🔒 contextBridge API Isolation</text>
            <text x="14" y="44" font-size="10" font-weight="500" fill="#475569">• Tuyệt đối KHÔNG truyền trực tiếp 'ipcRenderer'</text>
            <text x="14" y="62" font-size="10" font-weight="500" fill="#475569">• Đóng gói hàm an toàn theo danh sách xác thực</text>
            <text x="14" y="80" font-size="10" font-weight="500" fill="#475569">• Tách biệt hoàn toàn Global Window Scope</text>
            <text x="14" y="98" font-size="10" font-weight="700" fill="#b45309">➜ Triệt tiêu nguy cơ rò rỉ đối tượng Node.js</text>
          </g>

          <!-- Col 2.2: Channel Whitelist -->
          <g transform="translate(422, 422)">
            <rect width="315" height="110" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
            <text x="14" y="24" font-size="12" font-weight="800" fill="#92400e">📋 Whitelist 30+ Kênh IPC Định Kiểu</text>
            <text x="14" y="44" font-size="10" font-weight="500" fill="#475569">• Kiểm duyệt kênh theo quy tắc định danh nghiêm ngặt</text>
            <text x="14" y="62" font-size="10" font-weight="500" fill="#475569">• Phân loại kênh 1-chiều (send) & 2-chiều (invoke)</text>
            <text x="14" y="80" font-size="10" font-weight="500" fill="#475569">• Bác bỏ ngay lập tức các kênh không đăng ký trước</text>
            <text x="14" y="98" font-size="10" font-weight="700" fill="#b45309">➜ Chống giả mạo bản tin IPC (Spoofing)</text>
          </g>

          <!-- Col 2.3: Data Sanitization -->
          <g transform="translate(765, 422)">
            <rect width="315" height="110" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
            <text x="14" y="24" font-size="12" font-weight="800" fill="#92400e">🧹 Làm Sạch & Thẩm Định Tham Số</text>
            <text x="14" y="44" font-size="10" font-weight="500" fill="#475569">• Kiểm tra kiểu tham số truyền vào bằng TypeScript</text>
            <text x="14" y="62" font-size="10" font-weight="500" fill="#475569">• Làm sạch đường dẫn tệp (Path Traversal Guard)</text>
            <text x="14" y="80" font-size="10" font-weight="500" fill="#475569">• Giới hạn dung lượng tải tin (Payload Size Limit)</text>
            <text x="14" y="98" font-size="10" font-weight="700" fill="#b45309">➜ Ngăn chặn Command Injection độc hại</text>
          </g>
        </g>

        <!-- ==================== SECURITY BARRIER 2: PRIVILEGED BOUNDARY ==================== -->
        <g id="security-barrier-2" transform="translate(60, 563)">
          <rect width="1080" height="32" rx="6" fill="url(#grad-shield)" stroke="#f87171" stroke-width="1.2" stroke-dasharray="6 4"/>
          <text x="540" y="21" text-anchor="middle" font-size="11.5" font-weight="800" fill="#b91c1c" letter-spacing="0.5">
            ⚔️ RANH GIỚI BẢO MẬT 2: KIỂM SOÁT ĐẶC QUYỀN THỰC THI HỆ THỐNG NATIVE (IPC DISPATCHER) ⚔️
          </text>
          <!-- Downward flow arrows -->
          <line x1="240" y1="32" x2="240" y2="44" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-emerald)" />
          <line x1="540" y1="32" x2="540" y2="44" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-emerald)" />
          <line x1="840" y1="32" x2="840" y2="44" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-emerald)" />
        </g>

        <!-- ==================== TẦNG 3: TẦNG XỬ LÝ LÕI (MAIN APPLICATION LAYER) ==================== -->
        <g id="tier-3" class="diagram-card" filter="url(#shadow-card)">
          <rect x="60" y="610" width="1080" height="235" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.8" />
          <path d="M 60 624 A 14 14 0 0 1 74 610 L 1126 610 A 14 14 0 0 1 1140 624 L 1140 649 L 60 649 Z" fill="url(#grad-tier3)" />

          <!-- Title & Badges -->
          <text x="80" y="637" font-size="14" font-weight="800" fill="#ffffff">TẦNG 3: TẦNG XỬ LÝ LÕI & DỮ LIỆU QUÂN SỰ (MAIN APPLICATION LAYER)</text>
          <text x="610" y="637" font-size="12" font-weight="600" fill="#ccfbf1">|   VÙNG ĐƯỢC TIN CẬY • TRUSTED CORE & LOCAL AI</text>

          <rect x="940" y="618" width="185" height="22" rx="4" fill="#042f2e" />
          <text x="1032.5" y="633" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">100% Offline / Air-Gapped Ready</text>

          <text x="80" y="671" font-size="11.5" font-weight="600" fill="#0f766e">
            🛡️ Cơ chế bảo vệ: Quản lý bộ nhớ an toàn, cô lập mô hình AI ngoại tuyến, mã hóa dữ liệu quân sự, không phụ thuộc máy chủ bên ngoài.
          </text>

          <!-- 3 Columns inside Tier 3 -->
          <!-- Col 3.1: IPC Main Handlers & Native Host -->
          <g transform="translate(80, 687)">
            <rect width="315" height="142" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
            <text x="14" y="24" font-size="12" font-weight="800" fill="#0f766e">🖥️ Electron Main & Native Host</text>
            <text x="14" y="44" font-size="10" font-weight="500" fill="#475569">• ipcMain.handle: Xử lý các yêu cầu được ủy quyền</text>
            <text x="14" y="62" font-size="10" font-weight="500" fill="#475569">• Quản lý vòng đời ứng dụng (Lifecycle Management)</text>
            <text x="14" y="80" font-size="10" font-weight="500" fill="#475569">• Native File Dialog: Hạn chế người dùng chỉ chọn file hợp lệ</text>
            <text x="14" y="98" font-size="10" font-weight="500" fill="#475569">• File Loaders bóc tách an toàn (PDF, DOCX, XLSX, PPTX)</text>
            <text x="14" y="126" font-size="10" font-weight="700" fill="#115e59">➜ Quản lý tài nguyên phần cứng tập trung</text>
          </g>

          <!-- Col 3.2: Military Data & Vector Store -->
          <g transform="translate(422, 687)">
            <rect width="315" height="142" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
            <text x="14" y="24" font-size="12" font-weight="800" fill="#0f766e">🗄️ CSDL Véc-tơ & Dữ Liệu Quân Sự</text>
            <text x="14" y="44" font-size="10" font-weight="500" fill="#475569">• SQLite Cục bộ + Phần mở rộng sqlite-vec</text>
            <text x="14" y="62" font-size="10" font-weight="500" fill="#475569">• Drizzle ORM: Định nghĩa Schema chặt chẽ, an toàn</text>

  <!-- Download Scripts -->
  <script>
    // Export PNG 2K
    function downloadPNG() {
      const svg = document.getElementById('diagram-svg');
      const svgData = new XMLSerializer().serializeToString(svg);
      
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      
      const scale = 2;
      const width = 1200;
      const height = 960;
      
      canvas.width = width * scale;
      canvas.height = height * scale;
      
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);
      
      img.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const pngUrl = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngUrl;
        downloadLink.download = 'so_do_kien_truc_phan_tang_bao_mat_michat.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobURL);
      };
      
      img.src = blobURL;
    }

    // Export SVG Vector
    function downloadSVG() {
      const svg = document.getElementById('diagram-svg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const svgUrl = URL.createObjectURL(svgBlob);
      
      const downloadLink = document.createElement('a');
      downloadLink.href = svgUrl;
      downloadLink.download = 'so_do_kien_truc_phan_tang_bao_mat_michat.svg';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(svgUrl);
    }
  </script>
